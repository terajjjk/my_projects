<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f8f2">
    <title>Котик дня</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            font-family: "DM Sans", sans-serif;
            color: #193b35;
            background: #f5f8f2;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 20px;
            background-color: #f5f8f2;
            background-image: radial-gradient(#d5e3d7 0.8px, transparent 0.8px);
            background-size: 18px 18px;
        }

        main {
            width: min(100%, 510px);
            text-align: center;
            animation: appear 650ms ease-out both;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #5c786d;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 24px;
            font-family: "Fraunces", Georgia, serif;
            font-size: clamp(38px, 10vw, 58px);
            line-height: 1.05;
        }

        figure {
            margin: 0;
            overflow: hidden;
            border: 7px solid #fff;
            border-radius: 8px;
            background: #dce7dc;
            box-shadow: 0 18px 46px #2347381c;
        }

        figure img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
        }

        .caption {
            min-height: 28px;
            margin: 20px 0 16px;
            color: #5c786d;
            font-size: 15px;
        }

        button {
            min-height: 52px;
            padding: 0 24px;
            border: 0;
            border-radius: 6px;
            background: #df684b;
            color: #fff;
            font: 700 16px "DM Sans", sans-serif;
            cursor: pointer;
            transition: background-color 160ms ease, transform 160ms ease;
        }

        button:hover { background: #c95138; transform: translateY(-2px); }
        button:focus-visible { outline: 3px solid #193b35; outline-offset: 4px; }
        button:active { transform: translateY(0) scale(0.98); }

        @keyframes appear {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Маленькая порция счастья</p>
        <h1>Котик дня</h1>
        <figure>
            <img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&amp;fit=crop&amp;w=1100&amp;q=85" alt="Пушистый котик смотрит прямо в камеру">
        </figure>
        <p class="caption" id="message" aria-live="polite">Кажется, ему не хватает одного поглаживания.</p>
        <button id="pet-button" type="button">Погладить котика</button>
    </main>
    <script>
        const button = document.querySelector("#pet-button");
        const message = document.querySelector("#message");
        let pets = 0;

        button.addEventListener("click", () => {
            pets += 1;
            message.textContent = pets === 1 ? "Мур! Котик доволен." : `Мур! Котик доволен. Поглаживаний: ${pets}.`;
        });
    </script>
</body>
</html>
